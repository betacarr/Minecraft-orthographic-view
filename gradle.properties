# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# 1.19.4 对应的 Minecraft 与 Fabric 版本
minecraft_version=1.19.4
loader_version=0.14.21
loom_version=1.4-SNAPSHOT

# Mod Properties
# 发布版本号，附带 MC 版本标记
mod_version=1.0.0+mc1.19.4
# 你可以按需修改为自己的域名/用户名
maven_group=com.betacarr.orthographicview
archives_base_name=orthographic-view

# Dependencies
# 适用于 1.19.4 的 Fabric API 版本（可根据需要在 fabricmc.net/develop 上更新）
fabric_version=0.87.2+1.19.4